name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Theos
      run: |
        sudo apt-get update
        sudo apt-get install -y fakeroot dpkg-dev build-essential git curl apt-transport-https
        curl -fsSL https://apt.procursus.dev/keyring | sudo gpg --dearmor -o /usr/share/keyrings/procursus-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/procursus-archive-keyring.gpg] https://apt.procursus.dev/ubuntu jammy main" | sudo tee /etc/apt/sources.list.d/procursus.list
        sudo apt-get update
        sudo apt-get install -y ldid
        git clone --depth=1 https://github.com/theos/theos.git ~/theos
        echo "export THEOS=~/theos" >> ~/.bashrc
        echo "export PATH=~/theos/bin:$PATH" >> ~/.bashrc
        source ~/.bashrc
        
    - name: Build Tweak
      run: |
        source ~/.bashrc
        make package
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tweak-Package
        path: packages/*.deb
